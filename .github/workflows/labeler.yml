name: PR Labeler

on:
  pull_request:
    types: [opened, edited, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(?:\{BREAKING\})?\[(?:FEAT|FIX|REFACTOR|PERF|DOCS|STYLE|TEST|BUILD|CI|CHORE|DEPS|REVERT)\](?:\([^)]+\))? #\S+ - .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title does not match the required format.\n\n` +
                `Expected: {BREAKING}[PREFIX](scope) #branch-name - message\n` +
                `Got: "${title}"\n\n` +
                `Valid prefixes: FEAT, FIX, REFACTOR, PERF, DOCS, STYLE, TEST, BUILD, CI, CHORE, DEPS, REVERT\n` +
                `{BREAKING} and scope are optional.\n` +
                `Examples:\n` +
                `  {BREAKING}[FEAT](auth) #feat/auth-login - drop legacy auth api\n` +
                `  [FEAT](auth) #feat/auth-login - add auth login page\n` +
                `  [CI] #ci/workflows - add deploy job to ci workflow`
              );
            }

  label:
    needs: validate-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toUpperCase();

            let label;

            if (title.includes('{BREAKING}')) {
              label = 'breaking';
            } else if (title.includes('[FEAT]')) {
              label = 'feature';
            } else if (title.includes('[FIX]')) {
              label = 'bug';
            } else if (title.includes('[PERF]')) {
              label = 'perf';
            } else {
              label = 'chore';
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
