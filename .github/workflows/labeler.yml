name: PR Labeler

on:
  pull_request:
    types: [opened, edited, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toUpperCase();

            let label;

            if (title.includes('{BREAKING}')) {
              label = 'breaking';
            } else if (title.includes('[FEAT]')) {
              label = 'feature';
            } else if (title.includes('[FIX]')) {
              label = 'bug';
            } else if (title.includes('[PERF]')) {
              label = 'perf';
            } else {
              label = 'chore';
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
